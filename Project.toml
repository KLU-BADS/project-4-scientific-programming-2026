# The runnable scripts in scripts/ use this project directly
# (julia --project=. scripts/<name>.jl), so the packages they need are listed
# below together with the package's own dependencies.
#
# The docs and test environments are part of this workspace, so they resolve
# against the same manifest and find this package without being told where it
# is. Their own dependencies are in docs/Project.toml and test/Project.toml.

# Environment for the runnable scripts in this folder (data downloads,
# validation, forecast and charts). It is a member of the workspace defined in
# the root Project.toml, so it uses this package (Project4) directly.
#
# Install once, from the repository folder:
#     julia --project=scripts -e 'using Pkg; Pkg.instantiate()'
# Then run any script with --project=scripts, for example:
#     julia --project=scripts scripts/run_validation.jl

[deps]
CSV = "336ed68f-0bac-5ca0-87d4-7b16caf5d00b"
